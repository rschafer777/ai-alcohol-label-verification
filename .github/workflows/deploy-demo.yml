---
name: Deploy LabelVerify demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labelverify-demo
  cancel-in-progress: false

jobs:
  quality:
    name: Validate release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the immutable revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        shell: bash
        run: python -m pip install --disable-pip-version-check "uv==0.11.32"

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked application dependencies
        shell: pwsh
        run: |
          uv sync --frozen --link-mode copy
          uv run python ops/fetch_models.py models
          Push-Location frontend
          npm ci
          npx playwright install --with-deps chrome msedge
          Pop-Location

      - name: Run the complete release gate
        shell: pwsh
        run: ./scripts/release-check.ps1

      - name: Scan the public archive for unnecessary personal details
        shell: pwsh
        env:
          LABELVERIFY_PROHIBITED_PERSONAL_TERMS: >-
            ${{ secrets.LABELVERIFY_PROHIBITED_PERSONAL_TERMS }}
        run: >-
          uv run python scripts/scan_public_personal_details.py
          --output "$env:RUNNER_TEMP/public-personal-detail-scan.json"

      - name: Run the governed 30-case product corpus
        shell: pwsh
        run: >-
          uv run python scripts/validate_product_corpus.py
          --output "$env:RUNNER_TEMP/product-corpus.json"
          --build-id "$env:GITHUB_SHA"

  deploy:
    name: Build, deploy, and smoke test
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: demo
      url: https://${{ vars.AZURE_CONTAINER_APP_FQDN }}
    permissions:
      contents: read
      id-token: write
    outputs:
      deployment_started: ${{ steps.mutation.outputs.started }}
      had_previous: ${{ steps.previous.outputs.exists }}
      prior_image: ${{ steps.previous.outputs.image }}
      prior_deployment: ${{ steps.previous.outputs.deployment }}
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_CONTAINER_APP_FQDN: ${{ vars.AZURE_CONTAINER_APP_FQDN }}
      AZURE_ACR_PULL_IDENTITY_ID: ${{ vars.AZURE_ACR_PULL_IDENTITY_ID }}
      AZURE_IMAGE_NAME: ${{ vars.AZURE_IMAGE_NAME }}
      AZURE_EXPIRES_ON: ${{ vars.AZURE_EXPIRES_ON }}
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify environment configuration is complete
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AZURE_RESOURCE_GROUP
            AZURE_LOCATION
            AZURE_ACR_NAME
            AZURE_ACR_LOGIN_SERVER
            AZURE_CONTAINERAPPS_ENVIRONMENT
            AZURE_CONTAINER_APP_NAME
            AZURE_CONTAINER_APP_FQDN
            AZURE_ACR_PULL_IDENTITY_ID
            AZURE_IMAGE_NAME
            AZURE_EXPIRES_ON
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required demo environment value is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture a governed prior deployment for rollback
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          set +e
          app_json="$(az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-type Microsoft.App/containerApps \
            --api-version 2026-01-01 \
            --output json \
            --only-show-errors 2>"$error_file")"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            previous_image="$(jq -r \
              '.properties.template.containers[0].image' <<<"$app_json")"
            expected_prefix="${AZURE_ACR_LOGIN_SERVER}/${AZURE_IMAGE_NAME}@sha256:"
            digest="${previous_image#"$expected_prefix"}"
            if [[ "$previous_image" != "${expected_prefix}"* ||
                  ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "The prior image is not a governed immutable digest." >&2
              exit 1
            fi
            jq -e \
              --arg pull "$AZURE_ACR_PULL_IDENTITY_ID" \
              --arg host "$AZURE_CONTAINER_APP_FQDN" \
              '(.identity.userAssignedIdentities | keys | map(ascii_downcase)) ==
                 [($pull | ascii_downcase)] and
               .properties.configuration.ingress.fqdn == $host and
               (.properties.configuration.identitySettings | length) == 1 and
               (.properties.configuration.identitySettings[0].identity |
                 ascii_downcase) == ($pull | ascii_downcase) and
               .properties.configuration.identitySettings[0].lifecycle == "None"' \
              <<<"$app_json" >/dev/null
            prior_deployment="$(az deployment group list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "sort_by([?properties.provisioningState=='Succeeded' && \
                starts_with(name, 'labelverify-')], &properties.timestamp)[-1].name" \
              --output tsv \
              --only-show-errors)"
            if [[ -z "$prior_deployment" ]]; then
              echo "No governed successful deployment can restore the prior app." >&2
              exit 1
            fi
            deployment_image="$(az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$prior_deployment" \
              --query properties.parameters.imageReference.value \
              --output tsv \
              --only-show-errors)"
            if [[ "$deployment_image" != "$previous_image" ]]; then
              echo "The prior app does not match its governed deployment record." >&2
              exit 1
            fi
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "image=${previous_image}" >>"$GITHUB_OUTPUT"
            echo "deployment=${prior_deployment}" >>"$GITHUB_OUTPUT"
          elif grep -Eqi 'ResourceNotFound|could not be found' "$error_file"; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
            echo "image=" >>"$GITHUB_OUTPUT"
            echo "deployment=" >>"$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit "$status"
          fi

      - name: Authenticate Docker to the private registry
        shell: bash
        run: |
          set -euo pipefail
          arm_audience="$(az acr config authentication-as-arm show \
            --registry "$AZURE_ACR_NAME" \
            --query status \
            --output tsv \
            --only-show-errors)"
          [[ "${arm_audience,,}" == "enabled" ]]
          az acr login --name "$AZURE_ACR_NAME" --only-show-errors

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push the immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ vars.AZURE_IMAGE_NAME }}:${{ github.sha }}
          build-args: LABELVERIFY_BUILD_ID=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Prove container readiness before the Container App mutation boundary
        id: predeploy
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_reference="${AZURE_ACR_LOGIN_SERVER}/${AZURE_IMAGE_NAME}@${IMAGE_DIGEST}"
          container_name="labelverify-predeploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker pull "$image_reference"
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:18080:8080 \
            --env LABELVERIFY_ALLOWED_HOST=127.0.0.1:18080 \
            --env LABELVERIFY_CLIENT_IDENTITY_SOURCE=azure_container_apps \
            "$image_reference" >/dev/null
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:18080/health/ready >"$RUNNER_TEMP/predeploy-ready.json" && \
              jq -e '.ready == true and .profileId == "all_beverages_demo_v2"' \
                "$RUNNER_TEMP/predeploy-ready.json" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            docker logs "$container_name" >&2
            exit 1
          fi
          jq -e '.ready == true and .profileId == "all_beverages_demo_v2"' \
            "$RUNNER_TEMP/predeploy-ready.json" >/dev/null
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:18080/api/v1/meta >"$RUNNER_TEMP/predeploy-meta.json"
          jq -e --arg sha "$GITHUB_SHA" \
            '.buildId == $sha and .ready == true and .selectedCheckCount == 24' \
            "$RUNNER_TEMP/predeploy-meta.json" >/dev/null
          echo "ready=true" >>"$GITHUB_OUTPUT"

      - name: Mark the Container App mutation boundary
        id: mutation
        shell: bash
        env:
          PREDEPLOY_READY: ${{ steps.predeploy.outputs.ready }}
        run: |
          set -euo pipefail
          [[ "$PREDEPLOY_READY" == "true" ]]
          echo "started=true" >>"$GITHUB_OUTPUT"

      - name: Deploy the image digest through ARM
        id: deploy
        if: >-
          ${{ steps.predeploy.outputs.ready == 'true' &&
              steps.mutation.outputs.started == 'true' }}
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_reference="${AZURE_ACR_LOGIN_SERVER}/${AZURE_IMAGE_NAME}@${IMAGE_DIGEST}"
          revision_suffix="sha-${GITHUB_SHA::12}"
          deployment_name="labelverify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file ops/azure-container-app.json \
            --parameters \
              location="$AZURE_LOCATION" \
              containerAppName="$AZURE_CONTAINER_APP_NAME" \
              environmentName="$AZURE_CONTAINERAPPS_ENVIRONMENT" \
              registryServer="$AZURE_ACR_LOGIN_SERVER" \
              pullIdentityResourceId="$AZURE_ACR_PULL_IDENTITY_ID" \
              imageReference="$image_reference" \
              allowedHost="$AZURE_CONTAINER_APP_FQDN" \
              revisionSuffix="$revision_suffix" \
              repository="$GITHUB_REPOSITORY" \
              expiresOn="$AZURE_EXPIRES_ON" \
            --mode Incremental \
            --only-show-errors \
            --output none

      - name: Validate the effective Azure configuration
        id: effective_config
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_reference="${AZURE_ACR_LOGIN_SERVER}/${AZURE_IMAGE_NAME}@${IMAGE_DIGEST}"
          app_json="$(az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-type Microsoft.App/containerApps \
            --api-version 2026-01-01 \
            --output json \
            --only-show-errors)"
          jq -e \
            --arg image "$image_reference" \
            --arg registry "$AZURE_ACR_LOGIN_SERVER" \
            --arg pull "$AZURE_ACR_PULL_IDENTITY_ID" \
            --arg host "$AZURE_CONTAINER_APP_FQDN" \
            '
              .identity.type == "UserAssigned" and
              (.identity.userAssignedIdentities | has($pull)) and
              .properties.configuration.activeRevisionsMode == "Single" and
              .properties.configuration.ingress.external == true and
              .properties.configuration.ingress.allowInsecure == false and
              .properties.configuration.ingress.targetPort == 8080 and
              .properties.configuration.ingress.fqdn == $host and
              (.properties.configuration.ingress.transport | ascii_downcase) == "auto" and
              (.identity.userAssignedIdentities | keys | map(ascii_downcase)) ==
                [($pull | ascii_downcase)] and
              (.properties.configuration.registries | length) == 1 and
              .properties.configuration.registries[0].server == $registry and
              (.properties.configuration.registries[0].identity |
                ascii_downcase) == ($pull | ascii_downcase) and
              (.properties.configuration.identitySettings | length) == 1 and
              (.properties.configuration.identitySettings[0].identity |
                ascii_downcase) == ($pull | ascii_downcase) and
              .properties.configuration.identitySettings[0].lifecycle == "None" and
              ((.properties.configuration.secrets // []) | length) == 0 and
              (.properties.template.containers | length) == 1 and
              .properties.template.containers[0].name == "labelverify" and
              .properties.template.containers[0].image == $image and
              .properties.template.containers[0].resources.cpu == 4 and
              .properties.template.containers[0].resources.memory == "8Gi" and
              (any(.properties.template.containers[0].env[];
                .name == "LABELVERIFY_RUNTIME_MODE" and .value == "production")) and
              (any(.properties.template.containers[0].env[];
                .name == "LABELVERIFY_ALLOWED_HOST" and .value == $host)) and
              (any(.properties.template.containers[0].env[];
                .name == "LABELVERIFY_CLIENT_IDENTITY_SOURCE" and
                .value == "azure_container_apps")) and
              (.properties.template.containers[0].probes | length) == 3 and
              (all(.properties.template.containers[0].probes[];
                .httpGet.port == 8080 and
                (.httpGet.scheme | ascii_downcase) == "http" and
                (.httpGet.httpHeaders | length) == 1 and
                .httpGet.httpHeaders[0].name == "Host" and
                .httpGet.httpHeaders[0].value == $host and
                (has("tcpSocket") | not))) and
              (any(.properties.template.containers[0].probes[];
                (.type | ascii_downcase) == "startup" and
                .httpGet.path == "/health/live")) and
              (any(.properties.template.containers[0].probes[];
                (.type | ascii_downcase) == "liveness" and
                .httpGet.path == "/health/live")) and
              (any(.properties.template.containers[0].probes[];
                (.type | ascii_downcase) == "readiness" and
                .httpGet.path == "/health/ready")) and
              .properties.template.scale.minReplicas == 0 and
              .properties.template.scale.maxReplicas == 1 and
              .properties.template.scale.rules[0].http.metadata.concurrentRequests == "1" and
              ((.properties.template.volumes // []) | length) == 0
            ' <<<"$app_json" >/dev/null
          echo "Effective Azure configuration matches the governed demo contract."

      - name: Validate HTTPS, health, metadata, and a complete verification
        id: public_smoke
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://${AZURE_CONTAINER_APP_FQDN}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              --connect-timeout 3 --max-time 3 \
              "$base_url/health/ready" >"$work/ready.json" && \
              jq -e '.ready == true and .profileId == "all_beverages_demo_v2"' \
                "$work/ready.json" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == "true" ]]
          jq -e '.ready == true and .profileId == "all_beverages_demo_v2"' \
            "$work/ready.json" >/dev/null

          curl --fail --silent --show-error --max-time 20 \
            "$base_url/api/v1/meta" >"$work/meta.json"
          jq -e --arg sha "$GITHUB_SHA" \
            '.buildId == $sha and .ready == true and .selectedCheckCount == 24' \
            "$work/meta.json" >/dev/null

          curl --fail --silent --show-error --max-time 20 \
            "$base_url/api/v1/samples/distilled-spirits-v1" >"$work/sample.json"
          mapfile -t panel_urls < <(jq -r '.panels[].url' "$work/sample.json")
          [[ "${#panel_urls[@]}" -ge 1 && "${#panel_urls[@]}" -le 3 ]]
          panel_args=()
          for index in "${!panel_urls[@]}"; do
            panel_path="$work/panel-$((index + 1)).img"
            curl --fail --silent --show-error --max-time 20 \
              "$base_url${panel_urls[$index]}" >"$panel_path"
            panel_args+=(--form "panels=@${panel_path}")
          done
          reference="$(jq -c '.reference' "$work/sample.json")"
          for attempt in 1 2 3; do
            curl --fail --silent --show-error --max-time 40 \
              --header "Origin: $base_url" \
              --form-string "reference=$reference" \
              "${panel_args[@]}" \
              "$base_url/api/v1/verifications" >"$work/result-${attempt}.json"
          done
          performance_json="$(jq -s -c \
            '{durationsMs: map(.serverDurationMs),
              meanMs: ((map(.serverDurationMs) | add) / length),
              maximumMs: (map(.serverDurationMs) | max)}' \
            "$work"/result-*.json)"
          {
            echo "## Azure public verification timings"
            echo
            echo "- Full-sample server durations and statistics: \`${performance_json}\`"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -s -e --arg sha "$GITHUB_SHA" \
            'length == 3 and
             all(.[];
               .buildId == $sha and
               .profileId == "all_beverages_demo_v2" and
               (.serverDurationMs | type) == "number" and
               .serverDurationMs >= 0 and
               (.checks | length) == 24 and
               .summary == "Review needed" and
               ([.checks[] |
                 select(.applicable == true and .state == "Mismatch")] |
                 length) == 0 and
             ([.checks[] |
               select(.checkId == "warning_physical_size" and .state == "Not verified")] |
               length) == 1 and
             ([.checks[] |
               select(.checkId == "warning_wording" and
                 (.state == "Match" or .state == "Review"))] |
               length) == 1 and
             ([.checks[] |
               select(.applicable == true and .state != "Match") |
               [.checkId, .state]] |
               all(.[];
                 (. == ["warning_physical_size", "Not verified"]) or
                 (. == ["warning_wording", "Review"]))) and
             ((map(.serverDurationMs) | add) / length) < 5000 and
             (map(.serverDurationMs) | max) < 9000)' \
            "$work"/result-*.json >/dev/null

          curl --fail --silent --show-error --max-time 40 \
            --header "Origin: $base_url" \
            --cookie-jar "$work/cookies.txt" \
            --dump-header "$work/analysis-headers.txt" \
            "${panel_args[@]}" \
            "$base_url/api/v1/analyses" >"$work/analysis.json"
          tr -d '\r' <"$work/analysis-headers.txt" | \
            grep -Eqi '^set-cookie: labelverify_scope=[A-Za-z0-9_-]{43};.*HttpOnly;.*SameSite=Strict;.*Secure'
          history_id="$(jq -r '.verification.historyId' "$work/analysis.json")"
          jq -e --arg sha "$GITHUB_SHA" \
            '.buildId == $sha and
             .draft.beverageType == "distilled_spirits" and
             (.verification.checks | length) == 24 and
             (.verification.historyId | type) == "string" and
             (.verification.historyId | length) > 0' \
            "$work/analysis.json" >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            --cookie "$work/cookies.txt" \
            "$base_url/api/v1/history/${history_id}" >"$work/history.json"
          jq -e --arg history_id "$history_id" \
            '.id == $history_id and
             (.panels | length) >= 1 and
             (.panels | length) <= 3 and
             (.result.checks | length) == 24' \
            "$work/history.json" >/dev/null
          redirect_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --max-time 20 \
            "http://${AZURE_CONTAINER_APP_FQDN}/")"
          [[ "$redirect_status" == "301" || "$redirect_status" == "308" ]]
          curl --fail --silent --show-error --dump-header "$work/headers.txt" \
            --output /dev/null --max-time 20 "$base_url/"
          tr -d '\r' <"$work/headers.txt" | grep -qi '^strict-transport-security:'

          {
            echo "## Azure demo deployment"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Image digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Public URL: ${base_url}"
            echo "- ARM contract, HTTPS redirect, readiness, build metadata, and three-run full-sample performance gate: PASS"
          } >>"$GITHUB_STEP_SUMMARY"


  rollback:
    name: Restore the last governed deployment
    needs: deploy
    if: >-
      ${{ always() && needs.deploy.result == 'failure' &&
          needs.deploy.outputs.deployment_started == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_CONTAINER_APP_FQDN: ${{ vars.AZURE_CONTAINER_APP_FQDN }}
      AZURE_ACR_PULL_IDENTITY_ID: ${{ vars.AZURE_ACR_PULL_IDENTITY_ID }}
      AZURE_IMAGE_NAME: ${{ vars.AZURE_IMAGE_NAME }}
      AZURE_EXPIRES_ON: ${{ vars.AZURE_EXPIRES_ON }}
      HAD_PREVIOUS: ${{ needs.deploy.outputs.had_previous }}
      PREVIOUS_IMAGE: ${{ needs.deploy.outputs.prior_image }}
      PRIOR_DEPLOYMENT: ${{ needs.deploy.outputs.prior_deployment }}
    steps:
      - name: Check out the governed rollback template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore the prior digest or remove the failed first app
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAD_PREVIOUS" == "true" ]]; then
            expected_prefix="${AZURE_ACR_LOGIN_SERVER}/${AZURE_IMAGE_NAME}@sha256:"
            digest="${PREVIOUS_IMAGE#"$expected_prefix"}"
            if [[ "$PREVIOUS_IMAGE" != "${expected_prefix}"* ||
                  ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "The rollback image is not a governed immutable digest." >&2
              exit 1
            fi
            if [[ -z "$PRIOR_DEPLOYMENT" ||
                  ! "$PRIOR_DEPLOYMENT" =~ ^labelverify-[0-9A-Za-z-]+$ ]]; then
              echo "The governed rollback deployment name is invalid." >&2
              exit 1
            fi
            revision_suffix="rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            deployment_name="labelverify-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            prior_template="$(mktemp)"
            prior_parameters="$(az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$PRIOR_DEPLOYMENT" \
              --query properties.parameters \
              --output json \
              --only-show-errors)"
            az deployment group export \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$PRIOR_DEPLOYMENT" \
              --output json \
              --only-show-errors >"$prior_template"
            prior_image="$(jq -r '.imageReference.value' <<<"$prior_parameters")"
            [[ "$prior_image" == "$PREVIOUS_IMAGE" ]]
            az deployment group create \
              --name "$deployment_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file "$prior_template" \
              --parameters \
                location="$(jq -r '.location.value' <<<"$prior_parameters")" \
                containerAppName="$(jq -r '.containerAppName.value' <<<"$prior_parameters")" \
                environmentName="$(jq -r '.environmentName.value' <<<"$prior_parameters")" \
                registryServer="$(jq -r '.registryServer.value' <<<"$prior_parameters")" \
                pullIdentityResourceId="$(jq -r '.pullIdentityResourceId.value' \
                  <<<"$prior_parameters")" \
                imageReference="$PREVIOUS_IMAGE" \
                allowedHost="$(jq -r '.allowedHost.value' <<<"$prior_parameters")" \
                revisionSuffix="$revision_suffix" \
                repository="$(jq -r '.repository.value' <<<"$prior_parameters")" \
                expiresOn="$(jq -r '.expiresOn.value' <<<"$prior_parameters")" \
              --mode Incremental \
              --only-show-errors \
              --output none
            restored_image="$(az resource show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-type Microsoft.App/containerApps \
              --api-version 2026-01-01 \
              --query 'properties.template.containers[0].image' \
              --output tsv \
              --only-show-errors)"
            [[ "$restored_image" == "$PREVIOUS_IMAGE" ]]
            curl --fail --silent --show-error \
              --retry 30 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 40 \
              "https://${AZURE_CONTAINER_APP_FQDN}/health/ready" >/dev/null
            echo "Deployment gate failed. The prior digest was restored and verified." \
              >>"$GITHUB_STEP_SUMMARY"
          elif [[ "$HAD_PREVIOUS" == "false" ]]; then
            error_file="$(mktemp)"
            set +e
            az resource show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-type Microsoft.App/containerApps \
              --api-version 2026-01-01 \
              --output none \
              --only-show-errors 2>"$error_file"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              az resource delete \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-type Microsoft.App/containerApps \
                --api-version 2026-01-01 \
                --only-show-errors
              echo "First deployment failed. The new Container App was removed." \
                >>"$GITHUB_STEP_SUMMARY"
            elif grep -Eqi 'ResourceNotFound|could not be found' "$error_file"; then
              echo "First deployment failed before a Container App was retained." \
                >>"$GITHUB_STEP_SUMMARY"
            else
              cat "$error_file" >&2
              exit "$status"
            fi
          else
            echo "The prior deployment state was not captured." >&2
            exit 1
          fi
